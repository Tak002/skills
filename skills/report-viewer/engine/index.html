<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link id="css-md-light" rel="stylesheet" href="_viewer/vendor/github-markdown-light.min.css">
<link id="css-md-dark" rel="stylesheet" href="_viewer/vendor/github-markdown-dark.min.css" disabled>
<link id="css-hl-light" rel="stylesheet" href="_viewer/vendor/github.min.css">
<link id="css-hl-dark" rel="stylesheet" href="_viewer/vendor/github-dark.min.css" disabled>
<link rel="stylesheet" href="_viewer/app.css">
</head>
<body>
<header class="topbar">
  <button id="nav-btn" class="icon-btn" title="사이드바" aria-label="사이드바 열기/닫기">☰</button>
  <a class="brand" id="brand" href="#/">📄 Reports</a>
  <span class="root-ui" id="root-ui" hidden>
    <select id="root-sel" title="보고 있는 폴더"></select>
    <button id="root-add" class="icon-btn" title="PC 의 다른 폴더를 등록">➕ <span class="lbl">폴더 추가</span></button>
    <button id="root-del" class="icon-btn" title="이 폴더 등록 해제" hidden>➖</button>
    <button id="root-refresh" class="icon-btn" title="폴더 다시 읽기">🔄</button>
  </span>
  <input id="search" type="search" placeholder="검색 (제목·본문·태그)   /" autocomplete="off">
  <button id="live-btn" class="icon-btn live-btn" hidden>📂 폴더 열기</button>
  <button id="live-exit" class="icon-btn" title="실시간 모드 해제 (data.js 로 돌아가기)" hidden>✕</button>
  <button id="theme-btn" class="icon-btn" title="테마 전환">🌙</button>
</header>
<div class="layout" id="layout">
  <nav id="sidebar" class="sidebar"><div id="tree"></div>
    <div class="side-foot" id="side-foot"></div></nav>
  <main id="main" tabindex="-1"></main>
  <aside id="toc" class="toc" hidden></aside>
</div>

<!-- 폴더 추가 (서버 모드) -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-label="폴더 추가">
    <div class="modal-head"><b>📁 폴더 추가</b><span class="muted">PC 안의 어떤 폴더든 뷰어에 등록합니다</span><button id="modal-close" class="icon-btn" title="닫기">✕</button></div>
    <div class="fb-path"><input id="fb-input" placeholder="경로를 붙여넣고 Enter (예: C:\Users\이름\Documents)"><button id="fb-go" class="icon-btn">이동</button></div>
    <div class="fb-drives" id="fb-drives"></div>
    <div class="fb-crumb" id="fb-crumb"></div>
    <div class="fb-list" id="fb-list"></div>
    <div class="modal-foot"><input id="fb-name" placeholder="표시 이름 (비우면 폴더 이름)"><button id="fb-add" class="primary">이 폴더 추가</button></div>
  </div>
</div>

<script src="_viewer/vendor/marked.min.js"></script>
<script src="_viewer/vendor/marked-gfm-heading-id.umd.js"></script>
<script src="_viewer/vendor/highlight.min.js"></script>
<script src="_viewer/vendor/purify.min.js"></script>
<script src="_viewer/filetypes.js"></script>
<script src="_viewer/scan.js"></script>
<script src="_viewer/data.js"></script>
<script src="_viewer/app.js"></script>
</body>
</html>
